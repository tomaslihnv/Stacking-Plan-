<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stacking Plan - Isidora 3000</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ECEFF1; color: #212121; font-size: 13px; }

  /* Header */
  .header { background: #1A237E; color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header .subtitle { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .header-right { font-size: 11px; opacity: 0.8; text-align: right; line-height: 1.6; }

  /* Controls */
  .controls { background: white; padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #CFD8DC; }
  .ctrl-group { display: flex; align-items: center; gap: 7px; }
  .ctrl-group label { font-weight: 600; font-size: 11px; color: #607D8B; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .tipo-btn { padding: 4px 12px; border-radius: 20px; border: 2px solid #CFD8DC; background: white; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; color: #546E7A; }
  .tipo-btn.active { border-color: #1A237E; background: #1A237E; color: white; }
  .tipo-btn:hover:not(.active) { border-color: #7986CB; background: #E8EAF6; }
  select { padding: 4px 8px; border: 1px solid #CFD8DC; border-radius: 6px; font-size: 12px; background: white; }
  .ctrl-div { width: 1px; height: 24px; background: #CFD8DC; }
  .toggle-label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; font-weight: 500; color: #607D8B; }

  /* KPI bar */
  .kpi-bar { display: flex; gap: 10px; padding: 10px 24px; background: white; border-bottom: 1px solid #CFD8DC; flex-wrap: wrap; }
  .kpi { background: #F8F9FF; border: 1px solid #E8EAF6; border-radius: 8px; padding: 8px 14px; min-width: 140px; flex: 1; }
  .kpi-lbl { font-size: 10px; color: #90A4AE; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
  .kpi-val { font-size: 20px; font-weight: 700; color: #1A237E; }
  .kpi-sub { font-size: 10px; color: #B0BEC5; margin-top: 2px; }
  .kpi.green .kpi-val { color: #2E7D32; }
  .kpi.orange .kpi-val { color: #E65100; }
  .kpi.purple .kpi-val { color: #4A148C; }
  .kpi.red .kpi-val { color: #C62828; }

  /* Main layout */
  .main { display: flex; }

  /* Sidebar legend */
  .sidebar { width: 200px; min-width: 200px; background: white; border-right: 1px solid #CFD8DC; padding: 14px 10px; overflow-y: auto; max-height: calc(100vh - 180px); position: sticky; top: 0; }
  .sidebar h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #90A4AE; margin-bottom: 10px; font-weight: 700; padding: 0 4px; }
  .leg-item { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 4px; cursor: pointer; margin-bottom: 1px; transition: background 0.1s; }
  .leg-item:hover { background: #F5F5F5; }
  .leg-item.dimmed { opacity: 0.3; }
  .leg-dot { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; }
  .leg-name { font-size: 11px; font-weight: 500; color: #37474F; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leg-m2 { font-size: 10px; color: #B0BEC5; flex-shrink: 0; }

  /* Stacking area - scroll horizontally */
  .stacking-scroll { flex: 1; overflow: auto; padding: 12px 16px 24px; min-width: 0; }

  /* Building wrapper - flows top to bottom on screen = high floor to low floor */
  .building-wrap { display: inline-block; min-width: 100%; }

  /* Section label */
  .sec-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #90A4AE; margin: 14px 0 6px 52px; padding-bottom: 3px; border-bottom: 1px solid #CFD8DC; display: flex; align-items: center; gap: 10px; }
  .sec-scale { font-size: 10px; font-weight: 400; color: #B0BEC5; letter-spacing: 0; text-transform: none; }

  /* Gap indicator (missing floors) */
  .floor-gap { display: flex; align-items: center; margin: 4px 0; }
  .floor-gap-lbl { width: 44px; min-width: 44px; margin-right: 8px; }
  .floor-gap-bar { height: 8px; border-radius: 4px; background: repeating-linear-gradient(90deg, #E0E0E0 0, #E0E0E0 6px, transparent 6px, transparent 12px); flex: 0 0 auto; opacity: 0.6; }

  /* Floor row */
  .floor-row { display: flex; align-items: stretch; margin-bottom: 3px; height: 52px; }
  .floor-lbl { width: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #546E7A; background: #ECEFF1; border-radius: 4px; margin-right: 8px; flex-shrink: 0; }
  .floor-units { display: flex; gap: 3px; align-items: stretch; }

  /* Unit block */
  .unit-block { border-radius: 5px; padding: 5px 7px; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: center; border: 2px solid transparent; overflow: hidden; flex-shrink: 0; transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s; }
  .unit-block:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.25); z-index: 20; }
  .unit-block.dimmed { opacity: 0.15; }
  .unit-block.exp-crit { border-color: #D32F2F !important; box-shadow: inset 0 0 0 1px #D32F2F; }
  .unit-block.exp-warn { border-color: #F57C00 !important; }
  .unit-block.exp-watch { border-color: #FBC02D !important; }
  .u-num { font-size: 9px; font-weight: 700; opacity: 0.7; line-height: 1; }
  .u-tenant { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; line-height: 1.1; }
  .u-m2 { font-size: 9px; opacity: 0.65; margin-top: 3px; }

  /* Parking/Bodega bar */
  .summary-bar { flex: 0 0 auto; height: 100%; border-radius: 5px; display: flex; align-items: center; padding: 0 12px; font-size: 11px; font-weight: 500; gap: 10px; min-width: 300px; }

  /* Tooltip */
  .tip { position: fixed; background: #263238; color: white; border-radius: 8px; padding: 11px 13px; font-size: 12px; pointer-events: none; z-index: 9999; min-width: 200px; max-width: 280px; box-shadow: 0 8px 28px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.1s; }
  .tip.on { opacity: 1; }
  .tip-title { font-size: 13px; font-weight: 700; margin-bottom: 7px; }
  .tip-row { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  .tip-k { color: #78909C; }
  .tip-v { font-weight: 600; text-align: right; }
  .tip-hr { border: 0; border-top: 1px solid #37474F; margin: 5px 0; }
  .tip-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-top: 5px; }
  .b-vac { background: #546E7A; }
  .b-crit { background: #C62828; }
  .b-warn { background: #E65100; }
  .b-watch { background: #F9A825; color: #212121; }
  .b-ok { background: #2E7D32; }

  /* Expiry legend strip */
  .exp-strip { display: flex; align-items: center; gap: 14px; padding: 7px 24px; background: white; border-bottom: 1px solid #CFD8DC; flex-wrap: wrap; }
  .exp-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #546E7A; }
  .exp-sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; }

  .no-data { text-align: center; padding: 60px; color: #B0BEC5; font-size: 15px; }
</style>
</head>

<div class="exp-strip">

</div>

const DATA = RAW.units;
const COLORS = RAW.tenant_colors;
const TODAY = new Date(RAW.today);

document.getElementById('hdr-date').textContent =
  'Al ' + TODAY.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});

// ── State ──────────────────────────────────────────────
let activeTipos = new Set(['Oficinas','Locales']);
let filterTenant = '';
let filterExpiry = '';
let showVac = true;
let hlTenant = null;

// Tenant select
const allTenants = [...new Set(DATA.filter(u=>!u.vacante).map(u=>u.arrendatario))].sort();
const tsel = document.getElementById('f-tenant');
allTenants.forEach(t => { const o=document.createElement('option'); o.value=t; o.textContent=t; tsel.appendChild(o); });

// ── Helpers ─────────────────────────────────────────────
const flLbl = p => p > 0 ? 'P'+p : 'S'+Math.abs(p);

function daysUntil(s) {
  if (!s || s==='-') return null;
  const d = new Date(s);
  return isNaN(d) ? null : Math.round((d-TODAY)/86400000);
}

function expClass(u) {
  if (u.vacante) return '';
  const d = daysUntil(u.vencimiento);
  if (d===null) return '';
  if (d < 180) return 'exp-crit';
  if (d < 365) return 'exp-warn';
  if (d < 730) return 'exp-watch';
  return '';
}

function txtCol(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255 > 0.52 ? '#212121' : '#FFFFFF';
}

function fmt(n, d) {
  d=d||0;
  if (n===undefined||n===null||isNaN(n)) return '—';
  return n.toLocaleString('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d});
}

// ── Filter ──────────────────────────────────────────────
function getFiltered() {
  return DATA.filter(u => {
    if (!activeTipos.has(u.tipo)) return false;
    if (!showVac && u.vacante) return false;
    if (filterTenant && u.arrendatario !== filterTenant) return false;
    if (filterExpiry && !u.vacante && (!u.vencimiento || u.vencimiento > filterExpiry)) return false;
    return true;
  });
}

// ── KPIs ────────────────────────────────────────────────
function updateKPIs(f) {
  const occ = f.filter(u=>!u.vacante), vac = f.filter(u=>u.vacante);
  const totM2 = f.reduce((s,u)=>s+u.util_m2,0);
  const occM2 = occ.reduce((s,u)=>s+u.util_m2,0);
  const canon = occ.reduce((s,u)=>s+u.canon,0);
  const rate  = totM2>0 ? occM2/totM2*100 : 0;
  const avgUf = occM2>0 ? occ.reduce((s,u)=>s+u.uf_m2*u.util_m2,0)/occM2 : 0;
  document.getElementById('k-occ').textContent  = fmt(rate,1)+'%';
  document.getElementById('k-occ2').textContent = fmt(occM2,0)+' / '+fmt(totM2,0)+' m²';
  document.getElementById('k-canon').textContent= fmt(canon,1);
  document.getElementById('k-area').textContent = fmt(occM2,0)+' m²';
  document.getElementById('k-area2').textContent= fmt(vac.reduce((s,u)=>s+u.util_m2,0),0)+' m² vacante';
  document.getElementById('k-uf').textContent   = fmt(avgUf,3);
  const exp  = occ.filter(u=>{ const d=daysUntil(u.vencimiento); return d!==null&&d>=0&&d<365; });
  const expd = occ.filter(u=>{ const d=daysUntil(u.vencimiento); return d!==null&&d<0; });
  document.getElementById('k-exp').textContent  = exp.length+(expd.length?' (+'+expd.length+' venc.)':'');
  document.getElementById('k-exp2').textContent = fmt(exp.reduce((s,u)=>s+u.util_m2,0),0)+' m² en riesgo';
}

// ── Legend ───────────────────────────────────────────────
function updateLegend(f) {
  const tm={};
  f.forEach(u=>{ if(!u.vacante) tm[u.arrendatario]=(tm[u.arrendatario]||0)+u.util_m2; });
  const sorted = Object.entries(tm).sort((a,b)=>b[1]-a[1]);
  const list = document.getElementById('leg-list');
  list.innerHTML='';
  const vacM2 = f.filter(u=>u.vacante).reduce((s,u)=>s+u.util_m2,0);
  if (vacM2>0 && showVac) {
    const el=document.createElement('div');
    el.className='leg-item'+(hlTenant&&hlTenant!=='Vacante'?' dimmed':'');
    el.innerHTML='<div class="leg-dot" style="background:#CFD8DC;border:1px solid #90A4AE;"></div><span class="leg-name">Vacante</span><span class="leg-m2">'+fmt(vacM2,0)+'</span>';
    el.onclick=()=>toggleHL('Vacante');
    list.appendChild(el);
  }
  sorted.forEach(([t,m2])=>{
    const col=COLORS[t]||'#9E9E9E';
    const el=document.createElement('div');
    el.className='leg-item'+(hlTenant&&hlTenant!==t?' dimmed':'');
    el.innerHTML='<div class="leg-dot" style="background:'+col+'"></div><span class="leg-name" title="'+t+'">'+t+'</span><span class="leg-m2">'+fmt(m2,0)+'</span>';
    el.onclick=()=>toggleHL(t);
    list.appendChild(el);
  });
}

function toggleHL(t) { hlTenant=hlTenant===t?null:t; render(); }

// ── Scale ────────────────────────────────────────────────
// Calculate one consistent px-per-m² scale for the entire building.
// We use the max total-m² floor from the OFFICE section to anchor the scale,
// capped at TARGET_PX so the widest tower floor = TARGET_PX.
// Commercial / sub floors that are wider will overflow (scrollable).
const TARGET_PX = 900; // widest office floor → this many px

function calcScale(byFloor, ofLocFloors) {
  let maxM2 = 0;
  // Use only tower floors (>3) to set the scale reference
  ofLocFloors.filter(p=>p>3).forEach(piso => {
    const tot = (byFloor[piso]||[]).reduce((s,u)=>s+u.util_m2,0);
    if (tot > maxM2) maxM2 = tot;
  });
  // Fallback to all floors if no tower floors
  if (maxM2===0) ofLocFloors.forEach(piso=>{
    const tot=(byFloor[piso]||[]).reduce((s,u)=>s+u.util_m2,0);
    if(tot>maxM2) maxM2=tot;
  });
  return maxM2>0 ? TARGET_PX/maxM2 : 1;
}

// ── Render floors ────────────────────────────────────────
// floors array is in DESCENDING order (top of building first),
// which maps to top-of-screen-to-bottom, giving the correct building view.
function renderFloors(container, floors, byFloor, scale) {
  floors.forEach(piso => {
    const units = (byFloor[piso]||[]).filter(u=>u.tipo==='Oficinas'||u.tipo==='Locales');
    if (!units.length) return;

    const row = document.createElement('div');
    row.className = 'floor-row';

    const lbl = document.createElement('div');
    lbl.className = 'floor-lbl';
    lbl.textContent = flLbl(piso);
    row.appendChild(lbl);

    const ud = document.createElement('div');
    ud.className = 'floor-units';

    units.forEach(u => {
      // Absolute pixel width proportional to m²
      const pxW = Math.max(u.util_m2 * scale, 44); // min 44px for label visibility
      const col = u.vacante ? '#CFD8DC' : (COLORS[u.arrendatario]||'#9E9E9E');
      const tc  = u.vacante ? '#546E7A' : txtCol(col);
      const ec  = expClass(u);
      const dim = hlTenant && u.arrendatario !== hlTenant;

      const b = document.createElement('div');
      b.className = 'unit-block'+(ec?' '+ec:'')+(dim?' dimmed':'');
      b.style.cssText = 'width:'+pxW+'px;min-width:'+pxW+'px;background:'+col+';color:'+tc+';';
      if (u.vacante) b.style.borderColor = '#90A4AE';

      // Only show text if block is wide enough
      if (pxW >= 44) {
        const show_m2 = pxW >= 70;
        const show_num = pxW >= 44;
        b.innerHTML =
          (show_num ? '<div class="u-num">'+u.unidad+'</div>' : '') +
          '<div class="u-tenant">'+(u.vacante?'VACANTE':u.arrendatario)+'</div>' +
          (show_m2 ? '<div class="u-m2">'+fmt(u.util_m2,0)+' m²</div>' : '');
      }

      b.addEventListener('mouseenter', e=>showTip(e,u));
      b.addEventListener('mousemove',  moveTip);
      b.addEventListener('mouseleave', hideTip);
      ud.appendChild(b);
    });

    row.appendChild(ud);
    container.appendChild(row);
  });
}

// ── Main render ──────────────────────────────────────────
function render() {
  const f = getFiltered();
  updateKPIs(f);

  const byFloor = {};
  f.forEach(u => (byFloor[u.piso]=byFloor[u.piso]||[]).push(u));

  const ofLoc   = f.filter(u=>u.tipo==='Oficinas'||u.tipo==='Locales');
  const estac   = f.filter(u=>u.tipo==='Estacionamientos');
  const bodegas = f.filter(u=>u.tipo==='Bodegas');

  const bld = document.getElementById('building');
  bld.innerHTML = '';

  if (!f.length) {
    bld.innerHTML='<div class="no-data">Sin datos con los filtros aplicados</div>';
    updateLegend([]); return;
  }

  // All ofLoc floors, descending (high floor first → appears at top of building view)
  const ofLocFloors = [...new Set(ofLoc.map(u=>u.piso))].sort((a,b)=>b-a);
  const scale = calcScale(byFloor, ofLocFloors);

  // Update scale indicator in header
  document.getElementById('hdr-scale').textContent = fmt(1/scale, 2);

  const towerFloors = ofLocFloors.filter(p=>p>3);   // descending
  const commFloors  = ofLocFloors.filter(p=>p>=1&&p<=3); // descending
  const subFloors   = ofLocFloors.filter(p=>p<0);   // descending

  // ── TOWER ───────────────────────────────────────────
  if (towerFloors.length) {
    addSecLabel(bld, 'Torre Oficinas', scale);
    renderFloors(bld, towerFloors, byFloor, scale);
  }

  // Gap indicator between tower (P12) and commercial (P3) if both visible
  if (towerFloors.length && commFloors.length) {
    const minTower = towerFloors[towerFloors.length-1]; // lowest tower floor
    const maxComm  = commFloors[0]; // highest commercial floor
    if (minTower - maxComm > 1) {
      const gap = document.createElement('div');
      gap.className = 'floor-gap';
      gap.innerHTML = '<div class="floor-gap-lbl"></div>'
        +'<div class="floor-gap-bar" style="width:'+Math.round(TARGET_PX*0.55)+'px"></div>'
        +'<span style="font-size:10px;color:#B0BEC5;margin-left:8px;">Pisos '+(maxComm+1)+'–'+(minTower-1)+' (sin uso comercial)</span>';
      bld.appendChild(gap);
    }
  }

  // ── COMMERCIAL ──────────────────────────────────────
  if (commFloors.length) {
    addSecLabel(bld, 'Locales Comerciales', scale);
    renderFloors(bld, commFloors, byFloor, scale);
  }

  // ── SUB-LEVEL ───────────────────────────────────────
  if (subFloors.length) {
    addSecLabel(bld, 'Subterráneo — Oficinas / Locales', scale);
    renderFloors(bld, subFloors, byFloor, scale);
  }

  // ── ESTACIONAMIENTOS ────────────────────────────────
  if (estac.length) {
    addSecLabel(bld, 'Estacionamientos', null);
    const floors = [...new Set(estac.map(u=>u.piso))].sort((a,b)=>b-a);
    floors.forEach(piso => {
      const us=estac.filter(u=>u.piso===piso), occ=us.filter(u=>!u.vacante);
      const row=document.createElement('div'); row.className='floor-row';
      const lbl=document.createElement('div'); lbl.className='floor-lbl'; lbl.textContent=flLbl(piso); row.appendChild(lbl);
      const ud=document.createElement('div'); ud.className='floor-units';
      const bar=document.createElement('div'); bar.className='summary-bar';
      bar.style.cssText='background:#E3F2FD;border:1px solid #BBDEFB;color:#0D47A1;width:'+TARGET_PX+'px;';
      bar.innerHTML='&#128663; <b>'+occ.length+'</b> / '+us.length+' ocupados'
        +'<span style="margin-left:8px;font-weight:700;">'+fmt(occ.reduce((s,u)=>s+u.canon,0),1)+' UF/mes</span>'
        +'<span style="color:#90A4AE;font-size:10px;">'+(us.length-occ.length)+' libres</span>';
      ud.appendChild(bar); row.appendChild(ud); bld.appendChild(row);
    });
  }

  // ── BODEGAS ─────────────────────────────────────────
  if (bodegas.length) {
    addSecLabel(bld, 'Bodegas', null);
    const floors = [...new Set(bodegas.map(u=>u.piso))].sort((a,b)=>b-a);
    floors.forEach(piso => {
      const us=bodegas.filter(u=>u.piso===piso), occ=us.filter(u=>!u.vacante);
      const row=document.createElement('div'); row.className='floor-row';
      const lbl=document.createElement('div'); lbl.className='floor-lbl'; lbl.textContent=flLbl(piso); row.appendChild(lbl);
      const ud=document.createElement('div'); ud.className='floor-units';
      const bar=document.createElement('div'); bar.className='summary-bar';
      bar.style.cssText='background:#F3E5F5;border:1px solid #CE93D8;color:#6A1B9A;width:'+TARGET_PX+'px;';
      bar.innerHTML='&#128230; <b>'+occ.length+'</b> / '+us.length+' ocupadas'
        +'<span style="margin-left:8px;font-weight:700;">'+fmt(occ.reduce((s,u)=>s+u.canon,0),1)+' UF/mes</span>'
        +'<span style="color:#90A4AE;font-size:10px;">'+(us.length-occ.length)+' libres</span>';
      ud.appendChild(bar); row.appendChild(ud); bld.appendChild(row);
    });
  }

  updateLegend(f);
}

function addSecLabel(parent, text, scale) {
  const s = document.createElement('div');
  s.className = 'sec-label';
  s.innerHTML = text + (scale!==null ? '<span class="sec-scale">escala: 1 px &#8776; '+fmt(1/scale,2)+' m²</span>' : '');
  parent.appendChild(s);
}

// ── Tooltip ──────────────────────────────────────────────
const tip = document.getElementById('tip');
function showTip(e, u) {
  const d = daysUntil(u.vencimiento);
  let badge = '';
  if (u.vacante) badge='<span class="tip-badge b-vac">VACANTE</span>';
  else if (d!==null) {
    if (d<0)   badge='<span class="tip-badge b-crit">VENCIDO hace '+Math.abs(d)+' días</span>';
    else if(d<180) badge='<span class="tip-badge b-crit">VENCE en '+d+' días</span>';
    else if(d<365) badge='<span class="tip-badge b-warn">VENCE en '+d+' días</span>';
    else if(d<730) badge='<span class="tip-badge b-watch">'+d+' días restantes</span>';
    else badge='<span class="tip-badge b-ok">'+Math.round(d/365*10)/10+' años restantes</span>';
  }
  let h='<div class="tip-title">Unidad '+u.unidad+'</div><hr class="tip-hr">';
  if (!u.vacante) {
    h+='<div class="tip-row"><span class="tip-k">Arrendatario</span><span class="tip-v">'+u.arrendatario+'</span></div>';
    if (u.sociedad && u.sociedad!==u.arrendatario)
      h+='<div class="tip-row"><span class="tip-k">Sociedad</span><span class="tip-v" style="font-size:10px;max-width:160px;">'+u.sociedad+'</span></div>';
  }
  h+='<div class="tip-row"><span class="tip-k">Tipo</span><span class="tip-v">'+u.tipo+'</span></div>';
  h+='<div class="tip-row"><span class="tip-k">Sup. Útil</span><span class="tip-v">'+fmt(u.util_m2,2)+' m²</span></div>';
  h+='<hr class="tip-hr">';
  if (!u.vacante) {
    h+='<div class="tip-row"><span class="tip-k">Canon</span><span class="tip-v">'+fmt(u.canon,2)+' UF/mes</span></div>';
    h+='<div class="tip-row"><span class="tip-k">UF/m²/mes</span><span class="tip-v">'+fmt(u.uf_m2,4)+'</span></div>';
    h+='<hr class="tip-hr">';
    h+='<div class="tip-row"><span class="tip-k">Vencimiento</span><span class="tip-v">'+(u.vencimiento||'—')+'</span></div>';
    if (u.salida_anticipada) h+='<div class="tip-row"><span class="tip-k">Salida antic.</span><span class="tip-v">'+u.salida_anticipada+'</span></div>';
  }
  if (badge) h+='<div style="margin-top:7px">'+badge+'</div>';
  tip.innerHTML=h; tip.classList.add('on'); moveTip(e);
}
function moveTip(e) {
  let x=e.clientX+14, y=e.clientY+14;
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  if (x+tw>window.innerWidth-10)  x=e.clientX-tw-14;
  if (y+th>window.innerHeight-10) y=e.clientY-th-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip() { tip.classList.remove('on'); }

// ── Event listeners ──────────────────────────────────────
document.querySelectorAll('.tipo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const t=btn.dataset.tipo;
    if (activeTipos.has(t)) { if(activeTipos.size>1){ activeTipos.delete(t); btn.classList.remove('active'); } }
    else { activeTipos.add(t); btn.classList.add('active'); }
    render();
  });
});
document.getElementById('f-tenant').addEventListener('change', e=>{ filterTenant=e.target.value; render(); });
document.getElementById('f-expiry').addEventListener('change', e=>{ filterExpiry=e.target.value; render(); });
document.getElementById('f-vac').addEventListener('change',   e=>{ showVac=e.target.checked; render(); });

render();
</script>
