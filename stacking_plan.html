<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stacking Plan - Isidora 3000</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F5F5F5; color: #212121; font-size: 13px; }

  .header .subtitle { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .header-right { font-size: 12px; opacity: 0.8; text-align: right; }

  .controls { background: white; padding: 12px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid #E0E0E0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .control-group { display: flex; align-items: center; gap: 8px; }
  .control-group label { font-weight: 600; font-size: 12px; color: #616161; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .tipo-btn { padding: 4px 12px; border-radius: 20px; border: 2px solid #E0E0E0; background: white; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; color: #424242; }
  .tipo-btn.active { border-color: #1A237E; background: #1A237E; color: white; }
  .tipo-btn:hover:not(.active) { border-color: #9FA8DA; background: #E8EAF6; }
  select { padding: 5px 8px; border: 1px solid #E0E0E0; border-radius: 6px; font-size: 12px; background: white; cursor: pointer; }
  .control-divider { width: 1px; height: 28px; background: #E0E0E0; }
  .toggle-label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-weight: 500; color: #616161; }
  .toggle-label input { cursor: pointer; }

  .kpi-bar { display: flex; gap: 12px; padding: 12px 24px; background: white; border-bottom: 1px solid #E0E0E0; flex-wrap: wrap; }
  .kpi-card { background: #F8F9FF; border: 1px solid #E8EAF6; border-radius: 8px; padding: 10px 16px; min-width: 150px; flex: 1; }
  .kpi-label { font-size: 11px; color: #757575; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .kpi-value { font-size: 22px; font-weight: 700; color: #1A237E; }
  .kpi-sub { font-size: 11px; color: #9E9E9E; margin-top: 2px; }
  .kpi-card.green .kpi-value { color: #2E7D32; }
  .kpi-card.orange .kpi-value { color: #E65100; }
  .kpi-card.purple .kpi-value { color: #4A148C; }

  .main { display: flex; gap: 0; }

  .legend-sidebar { width: 220px; min-width: 220px; background: white; border-right: 1px solid #E0E0E0; padding: 16px 12px; overflow-y: auto; max-height: calc(100vh - 200px); position: sticky; top: 0; }
  .legend-sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #757575; margin-bottom: 12px; font-weight: 600; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; cursor: pointer; transition: background 0.1s; margin-bottom: 2px; }
  .legend-item:hover { background: #F5F5F5; }
  .legend-item.dimmed { opacity: 0.35; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend-name { font-size: 11px; font-weight: 500; color: #424242; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .legend-m2 { font-size: 10px; color: #9E9E9E; flex-shrink: 0; }

  .stacking-area { flex: 1; overflow-x: auto; padding: 16px 20px; min-width: 0; }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #9E9E9E; margin: 16px 0 8px 52px; border-bottom: 1px solid #E0E0E0; padding-bottom: 4px; }

  .floor-row { display: flex; align-items: stretch; margin-bottom: 4px; min-height: 52px; }
  .floor-label { width: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #616161; background: #EEEEEE; border-radius: 4px; margin-right: 8px; text-align: center; letter-spacing: 0.3px; }

  .floor-units { display: flex; gap: 3px; flex: 1; align-items: stretch; }

  .unit-block { border-radius: 5px; padding: 5px 7px; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s; position: relative; display: flex; flex-direction: column; justify-content: center; min-width: 70px; border: 2px solid transparent; overflow: hidden; }
  .unit-block:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.3); z-index: 10; }
  .unit-block.dimmed { opacity: 0.18; }
  .unit-block.expiry-critical { border-color: #D32F2F !important; }
  .unit-block.expiry-warning { border-color: #F57C00 !important; }
  .unit-block.expiry-watch { border-color: #FBC02D !important; }
  .unit-num { font-size: 10px; font-weight: 700; opacity: 0.75; }
  .unit-tenant { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .unit-m2 { font-size: 9px; opacity: 0.65; margin-top: 2px; }

  .parking-bar { flex: 1; height: 40px; border-radius: 5px; background: #E3F2FD; display: flex; align-items: center; padding: 0 14px; font-size: 12px; color: #1565C0; font-weight: 500; border: 1px solid #BBDEFB; gap: 16px; }

  .tooltip { position: fixed; background: #212121; color: white; border-radius: 8px; padding: 12px 14px; font-size: 12px; pointer-events: none; z-index: 9999; min-width: 210px; max-width: 290px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); opacity: 0; transition: opacity 0.12s; }
  .tooltip.visible { opacity: 1; }
  .tooltip-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .tooltip-row { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
  .tooltip-key { color: #9E9E9E; white-space: nowrap; }
  .tooltip-val { font-weight: 600; text-align: right; }
  .tooltip-divider { border: 0; border-top: 1px solid #424242; margin: 6px 0; }
  .tooltip-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-top: 4px; }
  .badge-vacante { background: #546E7A; }
  .badge-critical { background: #C62828; }
  .badge-warning { background: #E65100; }
  .badge-watch { background: #F9A825; color: #212121; }
  .badge-ok { background: #2E7D32; }

  .expiry-legend { display: flex; align-items: center; gap: 14px; padding: 8px 24px; background: #FAFAFA; border-bottom: 1px solid #E0E0E0; flex-wrap: wrap; }
  .expiry-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #616161; }
  .expiry-swatch { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; }

  .no-data { text-align: center; padding: 48px; color: #BDBDBD; font-size: 15px; }
</style>

<div class="header">

</div>

<div class="controls">

  <div class="control-divider"></div>
  <div class="control-group">
    <label>Arrendatario</label>
    <select id="filter-tenant"><option value="">Todos</option></select>
  </div>
  <div class="control-divider"></div>

  <label class="toggle-label">

</div>

<div class="kpi-bar">
  <div class="kpi-card">
    <div class="kpi-label">Ocupaci&#243;n</div>
    <div class="kpi-value" id="kpi-occ">&#8212;</div>
    <div class="kpi-sub" id="kpi-occ-sub"></div>
  </div>
  <div class="kpi-card green">
    <div class="kpi-label">Canon Total</div>
    <div class="kpi-value" id="kpi-canon">&#8212;</div>
    <div class="kpi-sub">UF / mes</div>
  </div>
  <div class="kpi-card orange">
    <div class="kpi-label">&#193;rea Ocupada</div>
    <div class="kpi-value" id="kpi-area">&#8212;</div>
    <div class="kpi-sub" id="kpi-area-sub"></div>
  </div>
  <div class="kpi-card purple">
    <div class="kpi-label">Canon Prom.</div>
    <div class="kpi-value" id="kpi-uf">&#8212;</div>
    <div class="kpi-sub">UF/m&#178; &middot; mes</div>
  </div>
  <div class="kpi-card" style="border-color:#FFCCBC;">
    <div class="kpi-label">Vence &lt;12 meses</div>
    <div class="kpi-value" id="kpi-expiring" style="color:#E64A19;">&#8212;</div>
    <div class="kpi-sub" id="kpi-expiring-sub"></div>
  </div>
</div>

<div class="expiry-legend">
  <span style="font-size:11px;font-weight:600;color:#757575;margin-right:4px;">Vencimiento:</span>
  <div class="expiry-item"><div class="expiry-swatch" style="border-color:#D32F2F;background:rgba(211,47,47,0.12);"></div> Vence &lt;6 meses</div>
  <div class="expiry-item"><div class="expiry-swatch" style="border-color:#F57C00;background:rgba(245,124,0,0.12);"></div> 6&#8211;12 meses</div>
  <div class="expiry-item"><div class="expiry-swatch" style="border-color:#FBC02D;background:rgba(251,192,45,0.12);"></div> 12&#8211;24 meses</div>
  <div class="expiry-item"><div class="expiry-swatch" style="background:#CFD8DC;border-color:#90A4AE;"></div> Vacante</div>
</div>

<div class="main">

    <h3>Arrendatarios</h3>
    <div id="legend-list"></div>
  </div>
  <div class="stacking-area" id="stacking-area"></div>
</div>

<div class="tooltip" id="tooltip"></div>

const DATA = RAW.units;
const COLORS = RAW.tenant_colors;
const TODAY = new Date(RAW.today);

document.getElementById('update-date').textContent = 'Al ' + TODAY.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});

let activeTipos = new Set(['Oficinas','Locales']);
let filterTenant = '';
let filterExpiry = '';
let showVacante = true;
let highlightedTenant = null;

// Populate tenant filter
const allTenants = [...new Set(DATA.filter(u=>!u.vacante).map(u=>u.arrendatario))].sort();
const tenantSel = document.getElementById('filter-tenant');
allTenants.forEach(t => {
  const o = document.createElement('option');
  o.value = t; o.textContent = t;
  tenantSel.appendChild(o);
});

function floorLabel(p) { return p > 0 ? 'P'+p : 'S'+Math.abs(p); }

function daysUntil(s) {
  if (!s || s==='-') return null;
  const d = new Date(s);
  if (isNaN(d)) return null;
  return Math.round((d - TODAY) / 86400000);
}

function expiryClass(u) {
  if (u.vacante) return '';
  const d = daysUntil(u.vencimiento);
  if (d === null) return '';
  if (d < 180) return 'expiry-critical';
  if (d < 365) return 'expiry-warning';
  if (d < 730) return 'expiry-watch';
  return '';
}

function textColor(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255 > 0.55 ? '#212121' : '#FFFFFF';
}

function fmt(n, dec) {
  dec = dec||0;
  if (n===undefined||n===null||isNaN(n)) return '—';
  return n.toLocaleString('es-CL',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}

function getFiltered() {
  return DATA.filter(u => {
    if (!activeTipos.has(u.tipo)) return false;
    if (!showVacante && u.vacante) return false;
    if (filterTenant && u.arrendatario !== filterTenant) return false;
    if (filterExpiry && !u.vacante && (!u.vencimiento || u.vencimiento > filterExpiry)) return false;
    return true;
  });
}

function updateKPIs(f) {
  const occ = f.filter(u=>!u.vacante);
  const vac = f.filter(u=>u.vacante);
  const totM2 = f.reduce((s,u)=>s+u.util_m2,0);
  const occM2 = occ.reduce((s,u)=>s+u.util_m2,0);
  const canon = occ.reduce((s,u)=>s+u.canon,0);
  const rate = totM2>0 ? occM2/totM2*100 : 0;
  const avgUf = occM2>0 ? occ.reduce((s,u)=>s+u.uf_m2*u.util_m2,0)/occM2 : 0;
  document.getElementById('kpi-occ').textContent = fmt(rate,1)+'%';
  document.getElementById('kpi-occ-sub').textContent = fmt(occM2,0)+' / '+fmt(totM2,0)+' m²';
  document.getElementById('kpi-canon').textContent = fmt(canon,1);
  document.getElementById('kpi-area').textContent = fmt(occM2,0)+' m²';
  document.getElementById('kpi-area-sub').textContent = fmt(vac.reduce((s,u)=>s+u.util_m2,0),0)+' m² vacante';
  document.getElementById('kpi-uf').textContent = fmt(avgUf,3);
  const exp = occ.filter(u=>{ const d=daysUntil(u.vencimiento); return d!==null && d>=0 && d<365; });
  const expd = occ.filter(u=>{ const d=daysUntil(u.vencimiento); return d!==null && d<0; });
  document.getElementById('kpi-expiring').textContent = exp.length + (expd.length ? ' (+'+expd.length+' venc.)':'');
  document.getElementById('kpi-expiring-sub').textContent = fmt(exp.reduce((s,u)=>s+u.util_m2,0),0)+' m² en riesgo';
}

function updateLegend(f) {
  const tm = {}, tc = {};
  f.forEach(u=>{ if(u.vacante)return; tm[u.arrendatario]=(tm[u.arrendatario]||0)+u.util_m2; tc[u.arrendatario]=(tc[u.arrendatario]||0)+u.canon; });
  const sorted = Object.entries(tm).sort((a,b)=>b[1]-a[1]);
  const list = document.getElementById('legend-list');
  list.innerHTML = '';
  const vacM2 = f.filter(u=>u.vacante).reduce((s,u)=>s+u.util_m2,0);
  if (vacM2>0 && showVacante) {
    const el = document.createElement('div');
    el.className = 'legend-item'+(highlightedTenant&&highlightedTenant!=='Vacante'?' dimmed':'');
    el.innerHTML = '<div class="legend-dot" style="background:#CFD8DC;border:1px solid #90A4AE;"></div><span class="legend-name">Vacante</span><span class="legend-m2">'+fmt(vacM2,0)+' m²</span>';
    el.addEventListener('click',()=>toggleHL('Vacante'));
    list.appendChild(el);
  }
  sorted.forEach(([t,m2])=>{
    const col = COLORS[t]||'#9E9E9E';
    const el = document.createElement('div');
    el.className = 'legend-item'+(highlightedTenant&&highlightedTenant!==t?' dimmed':'');
    el.innerHTML = '<div class="legend-dot" style="background:'+col+';"></div><span class="legend-name" title="'+t+'">'+t+'</span><span class="legend-m2">'+fmt(m2,0)+' m²</span>';
    el.addEventListener('click',()=>toggleHL(t));
    list.appendChild(el);
  });
}

function toggleHL(t) { highlightedTenant = highlightedTenant===t ? null : t; render(); }

function renderFloors(area, floors, byFloor) {
  floors.forEach(piso=>{
    const units = (byFloor[piso]||[]).filter(u=>u.tipo==='Oficinas'||u.tipo==='Locales');
    if (!units.length) return;
    const row = document.createElement('div');
    row.className = 'floor-row';
    const lbl = document.createElement('div');
    lbl.className = 'floor-label';
    lbl.textContent = floorLabel(piso);
    row.appendChild(lbl);
    const ud = document.createElement('div');
    ud.className = 'floor-units';
    units.forEach(u=>{
      const col = u.vacante ? '#CFD8DC' : (COLORS[u.arrendatario]||'#9E9E9E');
      const tc = u.vacante ? '#546E7A' : textColor(col);
      const ec = expiryClass(u);
      const dim = highlightedTenant && u.arrendatario !== highlightedTenant;
      const b = document.createElement('div');
      b.className = 'unit-block'+(ec?' '+ec:'')+(dim?' dimmed':'');
      b.style.cssText = 'background:'+col+';color:'+tc+';flex-grow:'+Math.max(u.util_m2,50)+';flex-basis:0;';
      if (u.vacante) { b.style.border='2px solid #90A4AE'; }
      b.innerHTML = '<div class="unit-num">'+u.unidad+'</div><div class="unit-tenant">'+(u.vacante?'VACANTE':u.arrendatario)+'</div><div class="unit-m2">'+fmt(u.util_m2,0)+' m²</div>';
      b.addEventListener('mouseenter',e=>showTip(e,u));
      b.addEventListener('mousemove',moveTip);
      b.addEventListener('mouseleave',hideTip);
      ud.appendChild(b);
    });
    row.appendChild(ud);
    area.appendChild(row);
  });
}

function render() {
  const f = getFiltered();
  updateKPIs(f);
  const byFloor = {};
  f.forEach(u=>{ (byFloor[u.piso]=byFloor[u.piso]||[]).push(u); });
  const ofLoc = f.filter(u=>u.tipo==='Oficinas'||u.tipo==='Locales');
  const estac = f.filter(u=>u.tipo==='Estacionamientos');
  const bodegas = f.filter(u=>u.tipo==='Bodegas');
  const area = document.getElementById('stacking-area');
  area.innerHTML = '';
  if (!f.length) { area.innerHTML='<div class="no-data">Sin datos con los filtros aplicados</div>'; updateLegend([]); return; }

  const ofLocFloors = [...new Set(ofLoc.map(u=>u.piso))].sort((a,b)=>b-a);
  const towerFloors = ofLocFloors.filter(p=>p>3);
  const commFloors = ofLocFloors.filter(p=>p>=1&&p<=3);
  const subFloors = ofLocFloors.filter(p=>p<0);

  if (towerFloors.length) {
    const s=document.createElement('div'); s.className='section-label'; s.textContent='Torre Oficinas'; area.appendChild(s);
    renderFloors(area, towerFloors, byFloor);
  }
  if (commFloors.length) {
    const s=document.createElement('div'); s.className='section-label'; s.textContent='Locales Comerciales'; area.appendChild(s);
    renderFloors(area, commFloors, byFloor);
  }
  if (subFloors.length) {
    const s=document.createElement('div'); s.className='section-label'; s.textContent='Subterráneo (Oficinas / Locales)'; area.appendChild(s);
    renderFloors(area, subFloors, byFloor);
  }
  if (estac.length) {
    const s=document.createElement('div'); s.className='section-label'; s.textContent='Estacionamientos'; area.appendChild(s);
    const floors = [...new Set(estac.map(u=>u.piso))].sort((a,b)=>b-a);
    floors.forEach(piso=>{
      const us=estac.filter(u=>u.piso===piso), occ=us.filter(u=>!u.vacante);
      const row=document.createElement('div'); row.className='floor-row';
      const lbl=document.createElement('div'); lbl.className='floor-label'; lbl.textContent=floorLabel(piso); row.appendChild(lbl);
      const bar=document.createElement('div'); bar.className='parking-bar';
      bar.innerHTML='<span>🚗 <b>'+occ.length+'</b> / '+us.length+' ocupados</span><span style="color:#0D47A1;font-weight:700;">'+fmt(occ.reduce((s,u)=>s+u.canon,0),1)+' UF/mes</span><span style="color:#B0BEC5;font-size:11px;">'+(us.length-occ.length)+' libres</span>';
      const fd=document.createElement('div'); fd.className='floor-units'; fd.appendChild(bar); row.appendChild(fd); area.appendChild(row);
    });
  }
  if (bodegas.length) {
    const s=document.createElement('div'); s.className='section-label'; s.textContent='Bodegas'; area.appendChild(s);
    const floors = [...new Set(bodegas.map(u=>u.piso))].sort((a,b)=>b-a);
    floors.forEach(piso=>{
      const us=bodegas.filter(u=>u.piso===piso), occ=us.filter(u=>!u.vacante);
      const row=document.createElement('div'); row.className='floor-row';
      const lbl=document.createElement('div'); lbl.className='floor-label'; lbl.textContent=floorLabel(piso); row.appendChild(lbl);
      const bar=document.createElement('div');
      bar.style.cssText='flex:1;height:40px;border-radius:5px;background:#F3E5F5;border:1px solid #E1BEE7;display:flex;align-items:center;padding:0 14px;font-size:12px;color:#6A1B9A;font-weight:500;gap:16px;';
      bar.innerHTML='📦 <b>'+occ.length+'</b> / '+us.length+' ocupadas &nbsp;<span style="font-weight:700;">'+fmt(occ.reduce((s,u)=>s+u.canon,0),1)+' UF/mes</span><span style="color:#B0BEC5;font-size:11px;">'+(us.length-occ.length)+' libres</span>';
      const fd=document.createElement('div'); fd.className='floor-units'; fd.appendChild(bar); row.appendChild(fd); area.appendChild(row);
    });
  }

  updateLegend(f);
}

// Tooltip
const tip = document.getElementById('tooltip');
function showTip(e,u) {
  const d = daysUntil(u.vencimiento);
  let badge = '';
  if (u.vacante) badge='<span class="tooltip-badge badge-vacante">VACANTE</span>';
  else if (d!==null) {
    if (d<0) badge='<span class="tooltip-badge badge-critical">VENCIDO hace '+Math.abs(d)+' días</span>';
    else if (d<180) badge='<span class="tooltip-badge badge-critical">VENCE en '+d+' días</span>';
    else if (d<365) badge='<span class="tooltip-badge badge-warning">VENCE en '+d+' días</span>';
    else if (d<730) badge='<span class="tooltip-badge badge-watch">'+d+' días restantes</span>';
    else badge='<span class="tooltip-badge badge-ok">'+Math.round(d/365*10)/10+' años restantes</span>';
  }
  let h='<div class="tooltip-title">Unidad '+u.unidad+'</div><hr class="tooltip-divider">';
  if (!u.vacante) {
    h+='<div class="tooltip-row"><span class="tooltip-key">Arrendatario</span><span class="tooltip-val">'+u.arrendatario+'</span></div>';
    if (u.sociedad && u.sociedad!==u.arrendatario) h+='<div class="tooltip-row"><span class="tooltip-key">Sociedad</span><span class="tooltip-val" style="font-size:10px;max-width:160px;text-align:right;">'+u.sociedad+'</span></div>';
  }
  h+='<div class="tooltip-row"><span class="tooltip-key">Tipo</span><span class="tooltip-val">'+u.tipo+'</span></div>';
  h+='<div class="tooltip-row"><span class="tooltip-key">Sup. Útil</span><span class="tooltip-val">'+fmt(u.util_m2,2)+' m²</span></div>';
  h+='<hr class="tooltip-divider">';
  if (!u.vacante) {
    h+='<div class="tooltip-row"><span class="tooltip-key">Canon</span><span class="tooltip-val">'+fmt(u.canon,2)+' UF/mes</span></div>';
    h+='<div class="tooltip-row"><span class="tooltip-key">UF/m²/mes</span><span class="tooltip-val">'+fmt(u.uf_m2,4)+'</span></div>';
    h+='<hr class="tooltip-divider">';
    h+='<div class="tooltip-row"><span class="tooltip-key">Vencimiento</span><span class="tooltip-val">'+(u.vencimiento||'—')+'</span></div>';
    if (u.salida_anticipada) h+='<div class="tooltip-row"><span class="tooltip-key">Salida antic.</span><span class="tooltip-val">'+u.salida_anticipada+'</span></div>';
  }
  if (badge) h+='<div style="margin-top:8px;">'+badge+'</div>';
  tip.innerHTML=h;
  tip.classList.add('visible');
  moveTip(e);
}
function moveTip(e) {
  let x=e.clientX+14, y=e.clientY+14;
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  if (x+tw>window.innerWidth-10) x=e.clientX-tw-14;
  if (y+th>window.innerHeight-10) y=e.clientY-th-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip() { tip.classList.remove('visible'); }

document.querySelectorAll('.tipo-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const t=btn.dataset.tipo;
    if (activeTipos.has(t)) { if (activeTipos.size>1) { activeTipos.delete(t); btn.classList.remove('active'); } }
    else { activeTipos.add(t); btn.classList.add('active'); }
    render();
  });
});
document.getElementById('filter-tenant').addEventListener('change',e=>{ filterTenant=e.target.value; render(); });
document.getElementById('filter-expiry').addEventListener('change',e=>{ filterExpiry=e.target.value; render(); });
document.getElementById('show-vacante').addEventListener('change',e=>{ showVacante=e.target.checked; render(); });

render();
</script>
</body>
